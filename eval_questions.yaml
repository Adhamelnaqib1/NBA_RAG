# Gold set for the evaluation harness (see EVAL_DESIGN.md).
#
# expected_pages are Chroma `page` numbers: 1-based PDF page index (printed page number + 1). The same
# numbering is used by SQLite's source_page.
# gold_answer is a short, self-contained answer. `source` quotes the guide text it came from.
# Only items with `verified: true` are scored. Drafted items start unverified; set the flag after
# checking the answer against the PDF page.
#
# Batch 1: narrative items n1-n25. n1-n5 are the earlier hand-verified questions (pages unchanged,
# gold_answer newly added from the PDF text).
#
# `type` decides how an item is scored; the id prefix is only historical. Award-list questions (n3, n4, n23,
# n24, n25, n30, n31, n52, n53, m1, m2, m3, m4, m11) became numeric once the awards table was loaded: they are
# answered with run_sql, so they are not scored on search_guide retrieval. Their gold_sql was checked to
# return the verified gold_answer.

questions:
  # --- narrative: answered from the guide's text (search_guide) ---
  - id: n1
    type: narrative
    question: "What is the record for most points by one player in a single regular-season game, and who set it?"
    gold_answer: "100 points, by Wilt Chamberlain (Philadelphia vs. New York, March 2, 1962)."
    expected_pages: [199]
    source: "Records: Regular Season, 'Most points, game': 100—Wilt Chamberlain, Philadelphia vs. New York, at Hershey, Pa., March 2, 1962"
    verified: true

