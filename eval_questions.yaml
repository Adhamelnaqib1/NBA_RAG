# Retrieval eval questions for eval_retrieval.py.
#
# expected_pages are PDF page indexes, the same numbering as Chroma's `page` metadata and SQLite's
# source_page (the printed page number is one lower). A question counts as a hit@k if ANY expected page
# appears among the top-k retrieved chunks.
#
# Candidate pages came from a local text search of the PDF (no API calls); all were then checked against
# the PDF by hand (verified: true). Pages 52, 111-112 and 179-180 are the validated pilot-table pages.
# No answers are recorded here on purpose.

questions:
  # --- narrative: answered from the guide's text (search_guide) ---
  - id: n1
    category: narrative
    question: "What is the record for most points by one player in a single regular-season game, and who set it?"
    expected_pages: [199]
    verified: true
    note: "Records: Regular Season, 'Most points, game' list"

  - id: n2
    category: narrative
    question: "Which team won the 2025-26 NBA championship, and who was its head coach?"
    expected_pages: [6]
    verified: true
    note: "2025-26 Review: Regular Season, champion roster and coaches header"

  - id: n3
    category: narrative
    question: "Who was named NBA Finals MVP in 2026?"
    expected_pages: [102]
    verified: true
    note: "Award Winners, 'NBA Finals Most Valuable Player' list"

  - id: n4
    category: narrative
    question: "Who won the NBA Most Valuable Player award for the 2025-26 season?"
    expected_pages: [100, 99]
    verified: true
    note: "Award Winners, MVP list (p. 100); photo caption (p. 99)"

  - id: n5
    category: narrative
    question: "In what year was Red Auerbach enshrined in the Basketball Hall of Fame as a coach?"
    expected_pages: [189]
    verified: true
    note: "Hall of Fame list of enshrinees, coaches"

  # --- numeric: answerable from the loaded SQLite tables (run_sql) ---
  - id: t1
    category: numeric
    question: "Who was the 10th pick in the 2026 NBA Draft, and which team drafted him?"
    expected_pages: [52]
    verified: true
    note: "draft_2026 source page"

  - id: t2
    category: numeric
    question: "How many players taken in the 2026 NBA Draft were from countries other than the USA?"
    expected_pages: [52]
    verified: true
    note: "draft_2026 source page"

  - id: t3
    category: numeric
    question: "Which player has the most All-NBA First Team selections?"
    expected_pages: [111, 112]
    verified: true
    note: "all_nba_by_player source pages"

  - id: t4
    category: numeric
    question: "How many NBA Finals has Boston won?"
    expected_pages: [179, 180, 187]
    verified: true
    note: "nba_finals source pages + NBA Finals all-time team records p. 187; best answered via SQL over nba_finals"

  - id: t5
    category: numeric
    question: "How many times did the team with the best regular-season record win the NBA Finals?"
    expected_pages: [179, 180]
    verified: true
    note: "nba_finals source pages; uses winner_best_record"

  # --- mixed: need a table and the guide's text ---
  - id: m1
    category: mixed
    question: "Who won the 2026 NBA Finals, in how many games, and who was the Finals MVP?"
    expected_pages: [180, 102]
    verified: true
    note: "nba_finals p. 180 + Finals MVP list p. 102"

  - id: m2
    category: mixed
    question: "Which team drafted the No. 1 pick in 2026, and what was that team's 2025-26 regular-season record?"
    expected_pages: [52, 6]
    verified: true
    note: "draft_2026 p. 52 + division standings p. 6"

  - id: m3
    category: mixed
    question: "How many All-NBA selections does Shai Gilgeous-Alexander have, and how many MVP awards has he won?"
    expected_pages: [111, 100]
    verified: true
    note: "all_nba_by_player p. 111 + MVP list p. 100"

  - id: m4
    category: mixed
    question: "Which head coach won the most NBA Finals, and is he in the Basketball Hall of Fame?"
    expected_pages: [179, 180, 188, 189]
    verified: true
    note: "nba_finals + Finals coaching rankings p. 188 + Hall of Fame coaches list p. 189; coach count best answered via SQL over nba_finals"

  - id: m5
    category: mixed
    question: "Who won the 2016 NBA Finals, and who was the Finals MVP that year?"
    expected_pages: [180, 102]
    verified: true
    note: "nba_finals p. 180 + Finals MVP list p. 102"

  # --- All-NBA by season (all_nba_by_season, PDF pp. 104-109) ---
  - id: a1
    category: numeric
    question: "Who was on the 1996-97 All-NBA first team?"
    expected_pages: [107]
    verified: false
    note: "all_nba_by_season, 1996-97 block on p. 107"

  - id: a2
    category: numeric
    question: "How many times has LeBron James made the All-NBA first team?"
    expected_pages: [111, 109]
    verified: false
    note: "all_nba_by_player p. 111 or all_nba_by_season; SQL shows his First-team seasons on pp. 108 (2005-06..2013-14) and 109"

  - id: a3
    category: numeric
    question: "Who made the 2025-26 All-NBA third team?"
    expected_pages: [109]
    verified: false
    note: "all_nba_by_season, 2025-26 block on p. 109"
