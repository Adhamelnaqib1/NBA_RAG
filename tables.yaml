# Schema and Extraction Specification for NBA Tables
# Used by `extract_tables.py load --pdf <path> --spec tables.yaml`

tables:
  draft_2026:
    description: "2026 NBA Draft picks (Round 1 and Round 2) including draft position, player, drafting team, previous institution, and country of origin."
    pages:
      - page: 52
        bbox: [30, 50, 425, 635]
    strategy: "word_columns"
    column_splits:
      pick: [30, 52]
      player: [52, 140]
      drafting_team: [140, 240]
      before_nba: [240, 345]
      country: [345, 425]
    columns:
      pick: INTEGER
      player: TEXT
      drafting_team: TEXT
      before_nba: TEXT
      country: TEXT
    cleanup:
      strip_whitespace: true
      numeric_columns: ["pick"]

  all_nba_by_player:
    description: "All-time All-NBA team selections by player, containing total selections as well as First, Second, and Third Team counts."
    pages:
      - page: 111
        y_range: [45, 630]
        blocks:
          - x_range: [30, 155]
          - x_range: [155, 280]
          - x_range: [280, 410]
      - page: 112
        y_range: [45, 630]
        blocks:
          - x_range: [30, 155]
    strategy: "stacked_column_blocks"
    columns:
      player: TEXT
      total: INTEGER
      first_team: INTEGER
      second_team: INTEGER
      third_team: INTEGER
    cleanup:
      strip_whitespace: true
      numeric_columns: ["total", "first_team", "second_team", "third_team"]

  nba_finals:
    description: "Historical NBA Finals results from 1947 to 2026 with winning and losing teams, head coaches, and series game counts. winner_best_record / loser_best_record are 1 when that team had (or tied for) the best regular-season record (the '*' footnote on p.180)."
    pages:
      - page: 179
        bbox: [30, 45, 415, 630]
      - page: 180
        bbox: [30, 45, 415, 250]
    strategy: "line_regex"
    # dates: month + day range, may span months ("Sept. 30-Oct. 11"); must end in a digit.
    # teams: letters, dots, apostrophes, spaces only, with an optional "*" footnote marker ("* Boston" in 1959).
    line_pattern: '^(\d{4})\s+([A-Z][a-z]+\.?\s+\d+-(?:[A-Z][a-z]+\.?\s+)?\d+)\s+(\*?\s*[A-Za-z.'' ]+?)\s*\(([^)]+)\)\s+(\*?\s*[A-Za-z.'' ]+?)\s*\(([^)]+)\)\s+(\d)-(\d)$'
    line_fields:
      - year
      - dates
      - winner_team
      - winner_coach
      - loser_team
      - loser_coach
      - winner_games
      - loser_games
    columns:
      year: INTEGER
      dates: TEXT
      winner_team: TEXT
      winner_coach: TEXT
      loser_team: TEXT
      loser_coach: TEXT
      winner_games: INTEGER
      loser_games: INTEGER
      winner_best_record: INTEGER
      loser_best_record: INTEGER
    cleanup:
      strip_whitespace: true
      asterisk_flags:
        winner_team: winner_best_record
        loser_team: loser_best_record
      numeric_columns: ["year", "winner_games", "loser_games"]
