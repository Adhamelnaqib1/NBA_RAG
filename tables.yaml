# Schema and Extraction Specification for NBA Tables
# Used by `extract_tables.py load --pdf <path> --spec tables.yaml`

tables:
  draft_2026:
    description: "2026 NBA Draft picks (Round 1 and Round 2) including draft position, player, drafting team, previous institution, and country of origin. Match player names with LIKE on player_search (lowercase ASCII, straight apostrophes, no dots)."
    pages:
      - page: 52
        bbox: [30, 50, 425, 635]
    strategy: "word_columns"
    column_splits:
      pick: [30, 52]
      player: [52, 140]
      drafting_team: [140, 240]
      before_nba: [240, 345]
      country: [345, 425]
    columns:
      pick: INTEGER
      player: TEXT
      drafting_team: TEXT
      before_nba: TEXT
      country: TEXT
      player_search: TEXT
    cleanup:
      strip_whitespace: true
      search_columns:
        player: player_search
      numeric_columns: ["pick"]

  all_nba_by_player:
    description: "All-time All-NBA team selections by player, containing total selections as well as First, Second, and Third Team counts. Match player names with LIKE on player_search (lowercase ASCII, straight apostrophes, no dots)."
    pages:
      - page: 111
        y_range: [45, 630]
        blocks:
          - x_range: [30, 155]
          - x_range: [155, 280]
          - x_range: [280, 410]
      - page: 112
        y_range: [45, 630]
        blocks:
          - x_range: [30, 155]
    strategy: "stacked_column_blocks"
    columns:
      player: TEXT
      total: INTEGER
      first_team: INTEGER
      second_team: INTEGER
      third_team: INTEGER
      player_search: TEXT
    cleanup:
      strip_whitespace: true
      search_columns:
        player: player_search
      numeric_columns: ["total", "first_team", "second_team", "third_team"]

  nba_finals:
    description: "Historical NBA Finals results from 1947 to 2026 with winning and losing teams, head coaches, and series game counts. winner_best_record / loser_best_record are 1 when that team had (or tied for) the best regular-season record (the '*' footnote on p.180)."
    pages:
      - page: 179
        bbox: [30, 45, 415, 630]
      - page: 180
        bbox: [30, 45, 415, 250]
    strategy: "line_regex"
    # dates: month + day range, may span months ("Sept. 30-Oct. 11"); must end in a digit.
    # teams: letters, dots, apostrophes, spaces only, with an optional "*" footnote marker ("* Boston" in 1959).
    line_pattern: '^(\d{4})\s+([A-Z][a-z]+\.?\s+\d+-(?:[A-Z][a-z]+\.?\s+)?\d+)\s+(\*?\s*[A-Za-z.'' ]+?)\s*\(([^)]+)\)\s+(\*?\s*[A-Za-z.'' ]+?)\s*\(([^)]+)\)\s+(\d)-(\d)$'
    line_fields:
      - year
      - dates
      - winner_team
      - winner_coach
      - loser_team
      - loser_coach
      - winner_games
      - loser_games
    columns:
      year: INTEGER
      dates: TEXT
      winner_team: TEXT
      winner_coach: TEXT
      loser_team: TEXT
      loser_coach: TEXT
      winner_games: INTEGER
      loser_games: INTEGER
      winner_best_record: INTEGER
      loser_best_record: INTEGER
    cleanup:
      strip_whitespace: true
      asterisk_flags:
        winner_team: winner_best_record
        loser_team: loser_best_record
      numeric_columns: ["year", "winner_games", "loser_games"]

  all_nba_by_season:
    description: "All-NBA teams for every season 1946-47 to 2025-26, one row per player per team. season is written like '1996-97' and season_end_year is its ending year (1997). team_level is 'First', 'Second' or 'Third' (All-NBA First/Second/Third Team); only First and Second exist before 1988-89. team is the player's team that season as printed (city name, e.g. 'Chicago'). is_tie is 1 for entries the guide marks as a tie: the 1951-52 First Team has 6 players because of a tie. Match player names with LIKE on player_search (lowercase ASCII, straight apostrophes, no dots), e.g. player_search LIKE '%o''neal%'."
    pages:
      - {page: 104, y_range: [20, 625]}
      - {page: 105, y_range: [20, 625]}
      - {page: 106, y_range: [20, 625]}
      - {page: 107, y_range: [20, 625]}
      - {page: 108, y_range: [20, 625]}
      - {page: 109, y_range: [20, 625]}
    strategy: "season_blocks"
    columns_per_page: 3
    min_gutter: 15
    columns:
      season: TEXT
      season_end_year: INTEGER
      team_level: TEXT
      player: TEXT
      player_search: TEXT
      team: TEXT
      is_tie: INTEGER
    cleanup:
      strip_whitespace: true
      search_columns:
        player: player_search

  awards:
    description: "One row per award winner per year for the guide's award lists (PDF pp. 100-103). award is the printed heading in title case, stored exactly as: 'NBA Most Valuable Player', 'NBA Coach of the Year', 'NBA Rookie of the Year', 'NBA Most Improved Player', 'NBA Defensive Player of the Year', 'NBA Sixth Man of the Year', 'NBA Clutch Player of the Year', 'NBA Hustle Award', 'NBA Basketball Executive of the Year', 'NBA Finals Most Valuable Player', 'NBA Eastern Conference Finals MVP', 'NBA Western Conference Finals MVP', 'NBA All-Star Game Most Valuable Player', 'NBA Sportsmanship Award', 'Twyman-Stokes Teammate of the Year Award', 'Bob Lanier Community Assist Award', 'Kareem Abdul-Jabbar Social Justice Champion Award', 'J. Walter Kennedy Citizenship Award'. Use award = '<exact name>' (LIKE '%Most Valuable Player%' also matches the Finals and All-Star MVPs). The ACRONYMS list maps MVP, FMVP, ROY/ROTY, COY/COTY, DPOY, 6MOY, MIP, CPOY and All-Star MVP to these names (without the 'NBA ' prefix). season_label is as printed: season awards use '2025-26', while the Finals, conference finals and All-Star Game MVPs use calendar years such as '2026'. season_end_year is the ending year (2025-26 -> 2026; 2026 -> 2026). is_tie is 1 for entries the guide marks as a tie; a year can have several rows (ties, and five co-recipients of the Bob Lanier award in 2019-20). team is the team as printed (city name). Match player names with LIKE on player_search (lowercase ASCII, straight apostrophes, no dots)."
    pages:
      - {page: 100, y_range: [20, 625]}
      - {page: 101, y_range: [20, 625]}
      - {page: 102, y_range: [20, 625]}
      - {page: 103, y_range: [20, 625]}
    strategy: "award_blocks"
    min_gutter: 12
    ignore_headings: ["AWARD WINNERS", "INDIVIDUAL AWARDS"]
    drop_line_patterns: ["receives The ", "^Administered and selected by"]
    columns:
      award: TEXT
      season_label: TEXT
      season_end_year: INTEGER
      player: TEXT
      player_search: TEXT
      team: TEXT
      is_tie: INTEGER
    cleanup:
      strip_whitespace: true
      search_columns:
        player: player_search
